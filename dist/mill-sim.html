<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mill-Sim — CNC mill simulator</title>
<meta name="description" content="Browser CNC milling simulator: parametric tool library, G-code interpretation, collision checking and material removal.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23171b24'/><path d='M8 7h4v11a4 4 0 0 0 8 0V7h4v11a8 8 0 0 1-16 0z' fill='%234fd1c5'/></svg>">
<style>
/* Mill-Sim — dark shop-floor palette, dense but breathable. */

:root {
  --bg: #10131a;
  --bg-2: #171b24;
  --bg-3: #1e232e;
  --bg-4: #262c38;
  --line: #2c3341;
  --line-2: #39415199;
  --text: #dbe1ea;
  --text-dim: #96a0b1;
  --text-faint: #6d7787;
  --accent: #4fd1c5;
  --accent-2: #7aa2f7;
  --warn: #e8913c;
  --error: #f2545b;
  --ok: #7ad17a;
  --radius: 7px;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
}

.app { display: flex; flex-direction: column; height: 100vh; }

/* ---- top bar ---------------------------------------------------------- */

.topbar {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 14px;
  height: 46px;
  background: var(--bg-2);
  border-bottom: 1px solid var(--line);
  flex: none;
}
.brand { display: flex; align-items: baseline; gap: 8px; font-weight: 650; letter-spacing: .2px; }
.brand-mark { color: var(--accent); font-size: 18px; }
.brand-sub { color: var(--text-faint); font-weight: 400; font-size: 11.5px; }
.spacer { flex: 1; }
.view-buttons { display: flex; gap: 4px; }

/* ---- workspace -------------------------------------------------------- */

.workspace { display: flex; flex: 1; min-height: 0; }

.sidebar {
  width: 380px;
  flex: none;
  display: flex;
  flex-direction: column;
  background: var(--bg-2);
  border-right: 1px solid var(--line);
  min-height: 0;
}

.main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

.viewport { position: relative; flex: 1; min-height: 0; background: #151821; }
.viewport canvas { display: block; }

.view-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  padding: 12px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
}

.hud {
  background: #0d1017cc;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 8px 10px;
  font-family: var(--mono);
  font-size: 12px;
  backdrop-filter: blur(6px);
}
.hud-row { display: flex; gap: 8px; align-items: baseline; }
.hud-row span { color: var(--text-faint); }
.hud-row b { color: var(--text); font-weight: 600; min-width: 54px; }
.hud-row.dim b, .hud-row.dim span { color: var(--text-dim); font-weight: 500; }

.crash-badge {
  pointer-events: auto;
  cursor: pointer;
  background: #3a1418e6;
  border: 1px solid var(--error);
  color: #ffd4d6;
  border-radius: 999px;
  padding: 5px 12px;
  font-weight: 600;
  font-size: 12px;
}

/* ---- transport -------------------------------------------------------- */

.transport {
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--bg-2);
  border-top: 1px solid var(--line);
}
.scrub { flex: 1; min-width: 80px; }
.time { font-family: var(--mono); color: var(--text-dim); font-size: 12px; white-space: nowrap; }
.pill {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--text-dim);
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 2px 9px;
  white-space: nowrap;
}
.pill.seeking { color: var(--accent); border-color: #2f5b57; }
select.speed { width: 74px; }

/* ---- tabs ------------------------------------------------------------- */

.tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; }
.tab {
  flex: 1;
  padding: 10px 4px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-dim);
  font: inherit;
  font-weight: 550;
  cursor: pointer;
}
.tab:hover { color: var(--text); background: #ffffff06; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.subtabs { border-bottom: none; padding: 10px 12px 0; gap: 4px; }
.subtab {
  flex: 1;
  padding: 6px 8px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--bg-3);
  color: var(--text-dim);
  font: inherit;
  cursor: pointer;
}
.subtab.active { background: var(--bg-4); color: var(--text); border-color: var(--line-2); }

.panel-host { flex: 1; min-height: 0; display: flex; }
.panel { flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 24px; }
.panel-program { display: flex; flex-direction: column; overflow: hidden; padding-bottom: 0; }

/* ---- sections --------------------------------------------------------- */

.section { border-bottom: 1px solid var(--line); }
.section-head {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 9px 12px;
  cursor: pointer;
  font-weight: 600;
  font-size: 12px;
  letter-spacing: .3px;
  text-transform: uppercase;
  color: var(--text-dim);
  user-select: none;
}
.section-head:hover { color: var(--text); }
.caret { transition: transform .15s; font-size: 10px; }
.section-head.collapsed .caret { transform: rotate(-90deg); }
.section-body { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.section-body.collapsed { display: none; }
.section .section { border: 1px solid var(--line); border-radius: var(--radius); }

/* ---- form controls ---------------------------------------------------- */

.row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.row > * { flex: 1 1 0; min-width: 0; }
.row > .btn { flex: 0 1 auto; }

.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field-label { font-size: 11px; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.field-label .unit { color: #4f5866; }
.field .value { color: var(--accent); font-family: var(--mono); }

input[type="number"], input[type="text"], select, textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 5px;
  color: var(--text);
  padding: 5px 7px;
  font: inherit;
  font-family: var(--mono);
  font-size: 12px;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent-2); }
input[type="color"] { width: 100%; height: 28px; padding: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; }
input[type="range"] { width: 100%; accent-color: var(--accent); }

.checkbox { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); cursor: pointer; }
.checkbox input { accent-color: var(--accent); }

.btn {
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: 5px;
  color: var(--text);
  padding: 5px 10px;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { background: var(--bg-4); border-color: var(--line-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; }
.btn-primary { background: #1d3f3c; border-color: #2f6a63; color: #b7f0e9; }
.btn-primary:hover { background: #245049; }
.btn-warn:hover { border-color: var(--error); color: #ffc9cb; }
.btn.active { background: var(--bg-4); border-color: var(--accent); color: var(--accent); }
.btn-group { display: flex; gap: 4px; }
.btn-group .btn { flex: 1; }

.hint { font-size: 11.5px; color: var(--text-faint); line-height: 1.5; }
.hint b { color: var(--text-dim); }

/* ---- lists ------------------------------------------------------------ */

.list { display: flex; flex-direction: column; gap: 3px; max-height: 340px; overflow-y: auto; }
.list-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border: 1px solid transparent;
  border-radius: var(--radius);
  background: var(--bg-3);
  cursor: pointer;
}
.list-item:hover { background: var(--bg-4); }
.list-item.selected { border-color: var(--accent); background: #1a2b2e; }
.list-main { flex: 1; min-width: 0; }
.list-title { font-weight: 550; display: flex; gap: 6px; align-items: baseline; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-sub { font-size: 11px; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-actions { display: flex; gap: 3px; opacity: .5; }
.list-item:hover .list-actions { opacity: 1; }
.list-actions .btn { padding: 2px 7px; }
.tnum { font-family: var(--mono); color: var(--accent); font-size: 11px; }
.swatch { width: 10px; height: 26px; border-radius: 3px; flex: none; }
.stage-row { align-items: flex-end; }
.stage-index { flex: 0 0 14px; color: var(--text-faint); font-family: var(--mono); padding-bottom: 6px; }
.wcs-row { align-items: flex-end; }
.wcs-name { flex: 0 0 34px; font-family: var(--mono); color: var(--text-dim); padding-bottom: 6px; }

/* ---- stats ------------------------------------------------------------ */

.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stat { background: var(--bg-3); border-radius: 5px; padding: 6px 8px; min-width: 0; }
.stat-label { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .3px; }
.stat-value { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-value.dim { color: var(--text-dim); font-size: 11.5px; }

.extents { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11.5px; }
.extents th { color: var(--text-faint); font-weight: 500; text-align: right; padding: 2px 6px; }
.extents td { text-align: right; padding: 2px 6px; color: var(--text-dim); }
.extents tr th:first-child { text-align: left; color: var(--accent); }

.issues { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; max-height: 300px; overflow-y: auto; }
.issues li {
  font-size: 11.5px;
  padding: 5px 8px;
  border-radius: 5px;
  background: var(--bg-3);
  border-left: 3px solid var(--line-2);
  cursor: default;
  line-height: 1.4;
}
.issues li.issue-error { border-left-color: var(--error); }
.issues li.issue-warning { border-left-color: var(--warn); }
.issue-line { font-family: var(--mono); color: var(--text-faint); margin-right: 6px; }

.verdict { padding: 8px 10px; border-radius: var(--radius); font-weight: 550; }
.verdict.ok { background: #16301c; color: #b7e8bd; border: 1px solid #2c5c35; }
.verdict.bad { background: #331519; color: #ffc9cb; border: 1px solid #6a2b30; }

.collision-list { display: flex; flex-direction: column; gap: 4px; max-height: 420px; overflow-y: auto; }
.collision {
  background: var(--bg-3);
  border-left: 3px solid var(--error);
  border-radius: 5px;
  padding: 6px 9px;
  cursor: pointer;
}
.collision:hover { background: var(--bg-4); }
.collision.sev-warning { border-left-color: var(--warn); }
.collision-head { display: flex; justify-content: space-between; gap: 8px; }
.collision-type { font-weight: 600; font-size: 12px; }
.collision-line { font-family: var(--mono); font-size: 11px; color: var(--text-faint); }
.collision-msg { font-size: 11.5px; color: var(--text-dim); line-height: 1.4; }
.collision-meta { font-family: var(--mono); font-size: 10.5px; color: var(--text-faint); margin-top: 2px; }

/* ---- preview ---------------------------------------------------------- */

.preview {
  height: 220px;
  border-radius: var(--radius);
  background: radial-gradient(circle at 50% 30%, #232a36, #14171f);
  border: 1px solid var(--line);
  overflow: hidden;
  cursor: grab;
}
.preview:active { cursor: grabbing; }
.preview canvas { display: block; width: 100%; height: 100%; }

.dropzone {
  border: 1px dashed var(--line-2);
  border-radius: var(--radius);
  padding: 18px 12px;
  text-align: center;
  color: var(--text-faint);
  cursor: pointer;
  background: var(--bg-3);
}
.dropzone:hover, .dropzone.over { border-color: var(--accent); color: var(--accent); background: #17252a; }

/* ---- editor ----------------------------------------------------------- */

.toolbar { display: flex; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); flex: none; align-items: flex-end; }
.toolbar .field { flex: 0 1 130px; }
.editor-host { flex: 1 1 45%; min-height: 160px; display: flex; border-bottom: 1px solid var(--line); }
.summary-host { flex: 1 1 auto; overflow-y: auto; min-height: 0; }

.editor { display: flex; flex: 1; min-height: 0; background: var(--bg); font-family: var(--mono); font-size: 12px; }
.editor-gutter {
  flex: none;
  width: 52px;
  overflow: hidden;
  background: var(--bg-2);
  border-right: 1px solid var(--line);
  padding: 8px 0;
  user-select: none;
}
.gutter-line {
  padding: 0 8px 0 4px;
  text-align: right;
  color: var(--text-faint);
  line-height: 18px;
  height: 18px;
  cursor: pointer;
  white-space: nowrap;
}
.gutter-line:hover { color: var(--text); background: #ffffff08; }
.gutter-line.active { color: #10131a; background: var(--accent); font-weight: 700; }
.gutter-line.marker-error { color: var(--error); }
.gutter-line.marker-error::after { content: ' ●'; font-size: 8px; }
.gutter-line.marker-warning { color: var(--warn); }
.gutter-line.marker-warning::after { content: ' ●'; font-size: 8px; }

.editor-main { position: relative; flex: 1; min-width: 0; overflow: hidden; }
.editor-area {
  position: relative;
  width: 100%;
  height: 100%;
  border: none;
  border-radius: 0;
  background: transparent;
  color: var(--text);
  padding: 8px 10px;
  line-height: 18px;
  resize: none;
  white-space: pre;
  z-index: 1;
}
.editor-highlight {
  position: absolute;
  left: 0;
  right: 0;
  height: 18px;
  margin-top: 8px;
  background: #4fd1c51f;
  border-left: 2px solid var(--accent);
  pointer-events: none;
  display: none;
  z-index: 0;
}

/* ---- toasts ----------------------------------------------------------- */

.toast-host {
  position: fixed;
  right: 16px;
  bottom: 68px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: flex-end;
  z-index: 50;
  pointer-events: none;
}
.toast {
  background: var(--bg-3);
  border: 1px solid var(--line-2);
  border-left: 3px solid var(--accent-2);
  border-radius: var(--radius);
  padding: 8px 12px;
  max-width: 420px;
  font-size: 12px;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity .25s, transform .25s;
  box-shadow: 0 6px 20px #0008;
}
.toast.show { opacity: 1; transform: none; }
.toast-ok { border-left-color: var(--ok); }
.toast-error { border-left-color: var(--error); }
.toast-info { border-left-color: var(--accent); }

/* ---- boot ------------------------------------------------------------- */

.boot {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: var(--bg);
  z-index: 100;
}
.boot-inner { text-align: center; color: var(--text-dim); }
.boot-mark { font-size: 42px; color: var(--accent); }
.boot-title { font-size: 20px; font-weight: 650; color: var(--text); margin-top: 6px; }
.boot-sub { font-size: 12px; margin-top: 4px; }
.boot-error { max-width: 620px; text-align: left; padding: 24px; }
.boot-error pre { background: var(--bg-2); padding: 12px; border-radius: var(--radius); overflow: auto; font-size: 11px; color: var(--text-faint); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #333b49; border-radius: 6px; border: 2px solid var(--bg-2); }
::-webkit-scrollbar-thumb:hover { background: #414b5c; }

@media (max-width: 980px) {
  .sidebar { width: 320px; }
  .brand-sub { display: none; }
}

</style>
</head>
<body>
<div id="app" class="app"></div>
<noscript>Mill-Sim needs JavaScript and a WebGL2-capable browser.</noscript>
<div id="boot" class="boot">
  <div class="boot-inner">
    <div class="boot-mark">⌗</div>
    <div class="boot-title">Mill-Sim</div>
    <div class="boot-sub">starting up…</div>
  </div>
</div>
